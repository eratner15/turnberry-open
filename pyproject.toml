[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "municipal-miner"
version = "0.1.0"
description = "Pre-RFP intelligence mining from municipal meeting documents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0",
    "sqlite-utils>=3.35",
    "llm>=0.13",
    "pymupdf>=1.23.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "loguru>=0.7.2",
]

[project.scripts]
municipal-miner = "municipal_miner.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["municipal_miner*"]
